<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPS // Battle Arena</title>
  <meta name="description" content="A funky neon rock paper scissors game.">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --ink: #15292b;
      --muted: #557174;
      --cream: #fff9e8;
      --paper: #fffdf5;
      --acid: #d8ff57;
      --coral: #ff6b5c;
      --violet: #8067ff;
      --cyan: #5de5d3;
      --line: rgba(21, 41, 43, .16);
      --shadow: 7px 7px 0 var(--ink);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
      background: var(--cream);
      overflow-x: hidden;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      content: '';
      background:
        radial-gradient(circle at 86% 14%, rgba(128, 103, 255, .28) 0 9%, transparent 9.5%),
        radial-gradient(circle at 9% 86%, rgba(255, 107, 92, .2) 0 14%, transparent 14.5%),
        linear-gradient(115deg, transparent 0 46%, rgba(93, 229, 211, .15) 46.2% 47%, transparent 47.2% 100%);
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: '';
      opacity: .3;
      pointer-events: none;
      background-image: radial-gradient(var(--ink) .65px, transparent .65px);
      background-size: 18px 18px;
    }

    .shell {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 44px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .eyebrow, .mono, .score-label, .round-label {
      font-family: 'DM Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--coral);
      font-size: 12px;
      font-weight: 500;
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-size: clamp(45px, 8vw, 88px);
      line-height: .87;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    h1 span { color: var(--violet); }

    .scoreboard {
      display: flex;
      min-width: 210px;
      border: 2px solid var(--ink);
      box-shadow: var(--shadow);
      background: var(--paper);
    }

    .score {
      flex: 1;
      padding: 16px 18px 14px;
      text-align: center;
    }

    .score + .score { border-left: 2px solid var(--ink); }
    .score-label { display: block; color: var(--muted); font-size: 10px; }
    .score-value { display: block; margin-top: 4px; font-size: 38px; font-weight: 700; line-height: 1; }

    .arena {
      display: grid;
      grid-template-columns: 1.3fr .7fr;
      gap: 18px;
    }

    .battle-card, .history-card {
      border: 2px solid var(--ink);
      background: rgba(255, 253, 245, .82);
      box-shadow: var(--shadow);
    }

    .battle-card { padding: clamp(20px, 4vw, 38px); }

    .round-label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 11px;
    }

    .round-label::before { width: 22px; height: 3px; content: ''; background: var(--acid); }

    .versus {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 34px;
    }

    .fighter { text-align: center; }
    .fighter-name { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .choice-display {
      display: grid;
      place-items: center;
      width: min(180px, 28vw);
      aspect-ratio: 1;
      margin: auto;
      border: 2px solid var(--ink);
      background: var(--cyan);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: clamp(55px, 10vw, 92px);
      line-height: 1;
    }

    .computer .choice-display { background: var(--coral); }
    .choice-display.pulse { animation: pop .38s ease both; }
    @keyframes pop { 50% { transform: translateY(-8px) rotate(-4deg); } }
    .vs { font-size: 24px; font-weight: 700; font-style: italic; color: var(--violet); }

    .result {
      min-height: 32px;
      margin: 0 0 26px;
      text-align: center;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: -.03em;
    }

    .result small { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }

    .moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .move {
      min-height: 108px;
      border: 2px solid var(--ink);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .move:hover, .move:focus-visible { transform: translate(-3px, -3px); box-shadow: 4px 4px 0 var(--ink); outline: none; }
    .move:active { transform: translate(0, 0); box-shadow: none; }
    .move:nth-child(1) { background: var(--acid); }
    .move:nth-child(2) { background: var(--violet); color: var(--paper); }
    .move:nth-child(3) { background: var(--coral); }
    .move-icon { display: block; margin-bottom: 7px; font-size: 31px; }
    .move-name { display: block; font-size: 12px; text-transform: uppercase; }

    .history-card { padding: 24px; }
    .history-heading { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 2px solid var(--ink); }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.03em; }
    .clear-button { padding: 0; border: 0; color: var(--coral); background: transparent; font: 11px 'DM Mono', monospace; cursor: pointer; text-transform: uppercase; }
    .clear-button:hover { color: var(--violet); }
    .history-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .history-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .history-item:last-child { border-bottom: 0; }
    .history-choices { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; }
    .win { color: #228b70; } .loss { color: var(--coral); } .draw { color: var(--violet); }
    .empty { padding: 30px 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 26px; color: var(--muted); font: 11px 'DM Mono', monospace; text-transform: uppercase; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 22px, 560px); padding-top: 24px; }
      header { display: block; }
      .scoreboard { width: 100%; margin-top: 25px; }
      .arena { grid-template-columns: 1fr; }
      .history-card { box-shadow: var(--shadow); }
      .choice-display { width: min(140px, 30vw); }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">/// instant classic // edition 01</p>
        <h1>Rock<br><span>Paper</span><br>Scissor</h1>
      </div>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score"><span class="score-label">You</span><strong class="score-value" id="player-score">0</strong></div>
        <div class="score"><span class="score-label">CPU</span><strong class="score-value" id="computer-score">0</strong></div>
      </div>
    </header>

    <section class="arena" aria-label="Game arena">
      <div class="battle-card">
        <p class="round-label">Round <span id="round-number">01</span> / make your move</p>
        <div class="versus">
          <div class="fighter">
            <p class="fighter-name">You</p>
            <div class="choice-display" id="player-choice" aria-label="Your choice">?</div>
          </div>
          <div class="vs">VS</div>
          <div class="fighter computer">
            <p class="fighter-name">CPU</p>
            <div class="choice-display" id="computer-choice" aria-label="Computer choice">?</div>
          </div>
        </div>
        <p class="result" id="result" aria-live="polite">Choose your weapon<small>best of luck, legend</small></p>
        <div class="moves" aria-label="Choose a move">
          <button class="move" data-move="rock"><span class="move-icon">✊</span><span class="move-name">Rock</span></button>
          <button class="move" data-move="paper"><span class="move-icon">✋</span><span class="move-name">Paper</span></button>
          <button class="move" data-move="scissors"><span class="move-icon">✌</span><span class="move-name">Scissor</span></button>
        </div>
      </div>

      <aside class="history-card">
        <div class="history-heading"><h2>Battle log</h2><button class="clear-button" id="clear-history">Clear all</button></div>
        <ol class="history-list" id="history-list"><li class="empty">No battles yet.<br>Start the chaos.</li></ol>
      </aside>
    </section>

    <footer><span>Human intelligence vs. questionable algorithms</span><span>© RPS club</span></footer>
  </main>

  <script>
    const moves = {
      rock: { icon: '✊', label: 'Rock' },
      paper: { icon: '✋', label: 'Paper' },
      scissors: { icon: '✌', label: 'Scissor' }
    };
    const beats = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
    const state = { playerScore: 0, computerScore: 0, round: 0, history: [] };
    const playerChoice = document.querySelector('#player-choice');
    const computerChoice = document.querySelector('#computer-choice');
    const result = document.querySelector('#result');
    const historyList = document.querySelector('#history-list');

    function play(playerMove) {
      const keys = Object.keys(moves);
      const computerMove = keys[Math.floor(Math.random() * keys.length)];
      const outcome = playerMove === computerMove ? 'draw' : beats[playerMove] === computerMove ? 'win' : 'loss';
      state.round += 1;
      if (outcome === 'win') state.playerScore += 1;
      if (outcome === 'loss') state.computerScore += 1;
      state.history.unshift({ playerMove, computerMove, outcome });
      playerChoice.textContent = moves[playerMove].icon;
      computerChoice.textContent = moves[computerMove].icon;
      playerChoice.classList.remove('pulse');
      computerChoice.classList.remove('pulse');
      requestAnimationFrame(() => {
        playerChoice.classList.add('pulse');
        computerChoice.classList.add('pulse');
      });
      document.querySelector('#round-number').textContent = String(state.round).padStart(2, '0');
      document.querySelector('#player-score').textContent = state.playerScore;
      document.querySelector('#computer-score').textContent = state.computerScore;
      result.innerHTML = outcome === 'win' ? 'You win!' : outcome === 'loss' ? 'CPU wins!' : 'A stylish draw.';
      result.innerHTML += `<small>${moves[playerMove].label} vs ${moves[computerMove].label}</small>`;
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = state.history.length ? state.history.slice(0, 6).map((battle, index) => `
        <li class="history-item"><span><strong>#${String(state.round - index).padStart(2, '0')}</strong><br><span class="history-choices">${moves[battle.playerMove].label} / ${moves[battle.computerMove].label}</span></span><strong class="${battle.outcome}">${battle.outcome === 'win' ? 'WIN' : battle.outcome === 'loss' ? 'LOSS' : 'DRAW'}</strong></li>`).join('') : '<li class="empty">No battles yet.<br>Start the chaos.</li>';
    }

    document.querySelectorAll('.move').forEach(button => button.addEventListener('click', () => play(button.dataset.move)));
    document.querySelector('#clear-history').addEventListener('click', () => {
      state.playerScore = 0;
      state.computerScore = 0;
      state.round = 0;
      state.history = [];
      playerChoice.textContent = '?';
      computerChoice.textContent = '?';
      result.innerHTML = 'Choose your weapon<small>best of luck, legend</small>';
      document.querySelector('#round-number').textContent = '01';
      document.querySelector('#player-score').textContent = '0';
      document.querySelector('#computer-score').textContent = '0';
      renderHistory();
    });
  </script>
</body>
</html>
